# Local dev stack — the backend in Docker (stable Linux ODBC driver, no macOS
# pyodbc wedge) with hot reload + auto-migrate. This is the DEFAULT compose file:
#
#   docker compose up -d        # start backend (reuses the built image, no rebuild)
#   docker compose logs -f      # tail
#   docker compose down         # stop (own project — never touches the DB stack)
#   docker compose build        # ONLY when deps (pyproject.toml / uv.lock) change
#
# Prereq — the local SQL Server is a separate, persistent stack:
#   docker compose -f docker-compose.local-db.yml up -d
#
# Frontend: run it natively for the fastest hot reload:
#   cd frontend && npm run dev
# …or in Docker (best-effort) with:  docker compose --profile fullstack up -d

# Own project name so `down` here can never remove the DB container (which lives
# in the default project under docker-compose.local-db.yml).
name: evtrip-dev

services:
  backend:
    # Reuse the prebuilt image; `up` only builds it if absent or you pass --build.
    image: evtrip-dev-backend:latest
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: evtrip-api-dev
    ports:
      - "8000:8000"
    environment:
      # Reach the host-published local SQL Server (docker-compose.local-db.yml).
      - DATABASE_URL=mssql+aioodbc://sa:LocalDev_Passw0rd!@host.docker.internal:1433/evtripdb-dev?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes
      # Local-only dev secrets — the app refuses to boot with empty/placeholder
      # values, so these are non-empty throwaways. Never use them anywhere real.
      - SECRET_KEY=local-dev-secret-key-change-me
      - ENCRYPTION_KEY=local-dev-encryption-key-change-me
      # App config.
      - ENV=development
      - CORS_ORIGINS=*
      - FRONTEND_URL=http://localhost:3000
      - PROCESS_ROLE=all
      # macOS bind mounts don't propagate inotify events — make uvicorn poll so
      # --reload actually fires on save.
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      # Bind the source for hot reload; shadow the Linux venv with an anonymous
      # volume so the host's macOS .venv never clobbers it.
      - ./src:/app
      - /app/.venv
    # Wait for the DB (retry bootstrap), migrate, then serve with --reload.
    # --no-sync: use the image's prebuilt venv (no write to the read-only mount).
    command: >
      sh -c "for i in $$(seq 1 20); do
               uv run --no-sync python -m scripts.db_bootstrap && break || (echo 'waiting for DB...'; sleep 3);
             done &&
             uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"

  # Optional frontend-in-Docker (behind the `fullstack` profile). Native
  # `npm run dev` is faster and avoids SSR-in-container URL quirks — prefer it.
  frontend:
    profiles: ["fullstack"]
    image: node:20
    container_name: evtrip-web-dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"
