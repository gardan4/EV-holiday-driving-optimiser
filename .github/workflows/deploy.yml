name: CI + Deploy

# Single environment (dev) — this is a PoC, so `main` is the only branch that
# ships and `evtrip-*-dev` are the only App Services.
#
# Tests and container builds always run. The Azure deploy only runs once the
# AZURE_* secrets exist, so the pipeline stays green before infra is set up
# (rather than red-failing at `azure/login` on every push).
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ENVIRONMENT: dev
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.repository_owner }}/evtrip-api
  WEB_IMAGE: ${{ github.repository_owner }}/evtrip-web
  API_APP_NAME: evtrip-api-dev
  WEB_APP_NAME: evtrip-web-dev

jobs:
  # --- Decide what changed ---------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'

  # --- Infra: apply the Bicep template when infra/** changes -----------------
  # Infra used to be applied by hand, so the template and the running resources
  # drifted: `main.bicep` said one thing and Azure did another, and the only way
  # to notice was to go and look. The SKU change that motivated this job is
  # exactly that shape — committed, reviewed, and doing nothing.
  #
  # The reason it was manual is real, though. Every secret is an @secure()
  # param, and ARM treats an omitted one as empty, so a deployment missing a
  # secret does not fail — it succeeds and blanks the app setting. That has
  # already happened once here (empty ORS/OCM keys reached production). Hence
  # the preflight below: this job refuses to deploy at all unless every secret
  # is present and non-empty.
  infra:
    needs: [changes]
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Preflight — are all infra secrets present?
        id: pre
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Infra skipped::Azure is not configured yet."
            exit 0
          fi
          missing=""
          for v in SQL_ADMIN_PASSWORD APP_SECRET_KEY APP_ENCRYPTION_KEY ORS_API_KEY OCM_API_KEY GHCR_TOKEN; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Infra deploy refused::Missing repo secrets:$missing — deploying without them would overwrite the live app settings with empty values. Add them, or apply infra by hand."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure (OIDC)
        if: steps.pre.outputs.ready == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Pin the images that are running RIGHT NOW. The template has to set some
      # tag, and any fixed default is wrong the moment CI ships a new SHA — so
      # read it back off the live apps instead of guessing. This makes an
      # infra-only deploy provably code-neutral.
      - name: Resolve the running image tags
        if: steps.pre.outputs.ready == 'true'
        id: tags
        run: |
          api=$(az webapp config show -g ${{ secrets.RESOURCE_GROUP }} -n ${{ env.API_APP_NAME }} --query linuxFxVersion -o tsv)
          web=$(az webapp config show -g ${{ secrets.RESOURCE_GROUP }} -n ${{ env.WEB_APP_NAME }} --query linuxFxVersion -o tsv)
          api_tag="${api##*:}"
          web_tag="${web##*:}"
          if [ -z "$api_tag" ] || [ -z "$web_tag" ] || [ "$api_tag" = "$api" ]; then
            echo "::error title=Could not read running image tags::api='$api' web='$web'"
            exit 1
          fi
          echo "api_tag=$api_tag" >> "$GITHUB_OUTPUT"
          echo "web_tag=$web_tag" >> "$GITHUB_OUTPUT"
          echo "Pinning api=$api_tag web=$web_tag"

      # What-if first: the diff lands in the job log, so a surprising change
      # (a recreated database, a dropped app setting) is visible after the fact
      # even though this does not block.
      - name: What-if
        if: steps.pre.outputs.ready == 'true'
        continue-on-error: true
        run: |
          az deployment group what-if \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters \
              environmentName=${{ env.ENVIRONMENT }} \
              githubOwner=${{ github.repository_owner }} \
              apiImageTag=${{ steps.tags.outputs.api_tag }} \
              webImageTag=${{ steps.tags.outputs.web_tag }} \
              sqlAdminPassword='${{ secrets.SQL_ADMIN_PASSWORD }}' \
              secretKey='${{ secrets.APP_SECRET_KEY }}' \
              encryptionKey='${{ secrets.APP_ENCRYPTION_KEY }}' \
              orsApiKey='${{ secrets.ORS_API_KEY }}' \
              ocmApiKey='${{ secrets.OCM_API_KEY }}' \
              ghcrToken='${{ secrets.GHCR_TOKEN }}' \
            --output table

      - name: Deploy infra
        if: steps.pre.outputs.ready == 'true'
        run: |
          az deployment group create \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters \
              environmentName=${{ env.ENVIRONMENT }} \
              githubOwner=${{ github.repository_owner }} \
              apiImageTag=${{ steps.tags.outputs.api_tag }} \
              webImageTag=${{ steps.tags.outputs.web_tag }} \
              sqlAdminPassword='${{ secrets.SQL_ADMIN_PASSWORD }}' \
              secretKey='${{ secrets.APP_SECRET_KEY }}' \
              encryptionKey='${{ secrets.APP_ENCRYPTION_KEY }}' \
              orsApiKey='${{ secrets.ORS_API_KEY }}' \
              ocmApiKey='${{ secrets.OCM_API_KEY }}' \
              ghcrToken='${{ secrets.GHCR_TOKEN }}' \
            --output none

      - name: Note
        if: steps.pre.outputs.ready == 'true'
        run: echo "::notice title=Infra applied::Images left on api=${{ steps.tags.outputs.api_tag }} web=${{ steps.tags.outputs.web_tag }} — infra deploys do not move deployed code."

  # --- Backend: test + build (+ deploy when Azure is configured) -------------
  backend:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Install unixODBC (needed to import pyodbc)
        run: sudo apt-get update && sudo apt-get install -y unixodbc

      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12

      - name: Smoke-import the app
        working-directory: src
        env:
          SECRET_KEY: ci-smoke-test-secret
          ENCRYPTION_KEY: ci-smoke-test-encryption-key
          # Never connected to — the engine is lazy; tests use in-memory SQLite
          # via a dependency override. It only has to exist and parse.
          DATABASE_URL: mssql+aioodbc://sa:ci@localhost:1433/ci?driver=ODBC+Driver+18+for+SQL+Server
        run: |
          uv sync
          uv run python -c "import app.main; print('app imports OK')"

      - name: Run tests
        working-directory: src
        env:
          SECRET_KEY: ci-smoke-test-secret
          ENCRYPTION_KEY: ci-smoke-test-encryption-key
          # Never connected to — the engine is lazy; tests use in-memory SQLite
          # via a dependency override. It only has to exist and parse.
          DATABASE_URL: mssql+aioodbc://sa:ci@localhost:1433/ci?driver=ODBC+Driver+18+for+SQL+Server
        run: uv run pytest -q

      # `secrets` isn't available in job/step `if:` conditions, so turn its
      # presence into a step output the later steps can gate on.
      - name: Is Azure configured?
        id: az
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Tests passed. Set AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID / RESOURCE_GROUP / GHCR_TOKEN to enable deploys."
          fi

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: steps.az.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Always builds (validates the Dockerfile + uv.lock); only pushes when
      # there is somewhere to deploy it to.
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          push: ${{ steps.az.outputs.configured == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ env.ENVIRONMENT }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ env.ENVIRONMENT }}-latest
          cache-from: type=gha,scope=dev-api
          cache-to: type=gha,mode=max,scope=dev-api

      - name: Log in to Azure (OIDC)
        if: steps.az.outputs.configured == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API container
        if: steps.az.outputs.configured == 'true'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ env.ENVIRONMENT }}-${{ github.sha }}"
          az webapp config container set \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name ${{ env.API_APP_NAME }} \
            --container-image-name "$IMAGE" \
            --container-registry-url https://${{ env.REGISTRY }} \
            --container-registry-user ${{ github.repository_owner }} \
            --container-registry-password ${{ secrets.GHCR_TOKEN }}
          # `container set` above already rolls the container, so this restart is
          # belt-and-braces. ARM has been observed returning a spurious
          # ResourceNotFound here for a resource the same credential can read and
          # update moments earlier, so a failure must not fail the deploy.
          az webapp restart \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name ${{ env.API_APP_NAME }} \
            || echo "::warning title=Restart skipped::az webapp restart errored; the image swap already restarted the container." 

  # --- Frontend: test + build (+ deploy when Azure is configured) ------------
  frontend:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Type-check & build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://${{ env.API_APP_NAME }}.azurewebsites.net
          NEXT_PUBLIC_SITE_URL: https://${{ env.WEB_APP_NAME }}.azurewebsites.net
        run: |
          npm ci
          npx tsc --noEmit
          npx next build

      - name: Is Azure configured?
        id: az
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Type-check + build passed. Add the AZURE_* secrets to enable deploys."
          fi

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: steps.az.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ steps.az.outputs.configured == 'true' }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ env.API_APP_NAME }}.azurewebsites.net
            NEXT_PUBLIC_SITE_URL=https://${{ env.WEB_APP_NAME }}.azurewebsites.net
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ env.ENVIRONMENT }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ env.ENVIRONMENT }}-latest
          cache-from: type=gha,scope=dev-web
          cache-to: type=gha,mode=max,scope=dev-web

      - name: Log in to Azure (OIDC)
        if: steps.az.outputs.configured == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Web container
        if: steps.az.outputs.configured == 'true'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ env.ENVIRONMENT }}-${{ github.sha }}"
          az webapp config container set \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name ${{ env.WEB_APP_NAME }} \
            --container-image-name "$IMAGE" \
            --container-registry-url https://${{ env.REGISTRY }} \
            --container-registry-user ${{ github.repository_owner }} \
            --container-registry-password ${{ secrets.GHCR_TOKEN }}
          # `container set` above already rolls the container, so this restart is
          # belt-and-braces. ARM has been observed returning a spurious
          # ResourceNotFound here for a resource the same credential can read and
          # update moments earlier, so a failure must not fail the deploy.
          az webapp restart \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name ${{ env.WEB_APP_NAME }} \
            || echo "::warning title=Restart skipped::az webapp restart errored; the image swap already restarted the container." 
