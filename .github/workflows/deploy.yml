name: CI + Deploy

# Production lives in the marc-meijers subscription. The migration input stages
# the deployed releases against a restored database before DNS cutover.
on:
  workflow_dispatch:
    inputs:
      migration_stage:
        description: Stage the deployed releases privately before database/DNS cutover
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: evtrip-azure-production
  cancel-in-progress: false

env:
  ENVIRONMENT: prod
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.repository_owner }}/evtrip-api
  WEB_IMAGE: ${{ github.repository_owner }}/evtrip-web
  API_APP_NAME: evtrip-api-prod
  WEB_APP_NAME: evtrip-web-prod
  # Public URLs. These are baked into the web bundle at BUILD time (Next inlines
  # NEXT_PUBLIC_*), so changing the domain means rebuilding, not just re-pointing
  # DNS. The azurewebsites hosts stay reachable but are no longer what the app
  # calls itself.
  SITE_URL: https://evtrip.dev
  # IndexNow ownership key. Public by design — the proof is that the same value
  # is served from the site's own root, so there is nothing here to keep secret
  # and a GitHub secret would only hide it from the person maintaining it.
  # MUST match the filename in frontend/public/<key>.txt. Rotating means
  # renaming that file and this line in the same commit.
  INDEXNOW_KEY: 6581342a69b7a4d859b3c51982389db3
  API_URL: https://api.evtrip.dev

jobs:
  # --- Decide what changed ---------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'
              - '.github/workflows/deploy.yml'

  # Provision only after the database copy has been restored and checked.
  infra:
    needs: [changes]
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: azure-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate and deploy infrastructure
        env:
          MIGRATION_STAGE: ${{ inputs.migration_stage && 'true' || 'false' }}
          MIGRATION_COMPLETE: ${{ vars.MIGRATION_COMPLETE }}
          MIGRATION_OPERATOR_IPS: ${{ vars.MIGRATION_OPERATOR_IPS }}
          CUSTOM_DOMAINS_ENABLED: ${{ vars.CUSTOM_DOMAINS_ENABLED || 'false' }}
          ORIGIN_CERTIFICATE_PFX: ${{ secrets.ORIGIN_CERTIFICATE_PFX }}
          ORIGIN_CERTIFICATE_PASSWORD: ${{ secrets.ORIGIN_CERTIFICATE_PASSWORD }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: python3 infra/deploy.py
      - name: Verify destination API
        env:
          MIGRATION_STAGE: ${{ inputs.migration_stage && 'true' || 'false' }}
        run: |
          URL="${API_URL}/health"
          if [ "$MIGRATION_STAGE" = "true" ]; then URL="https://${API_APP_NAME}.azurewebsites.net/health"; fi
          curl --fail --silent --show-error --retry 15 --retry-delay 10 --retry-all-errors \
            "$URL"

  # --- Backend: test + build (+ deploy when Azure is configured) -------------
  backend:
    needs: [changes, infra]
    if: >-
      always() && !cancelled() && !inputs.migration_stage &&
      needs.infra.result != 'failure' &&
      (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: azure-production
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Install unixODBC (needed to import pyodbc)
        run: sudo apt-get update && sudo apt-get install -y unixodbc

      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12

      - name: Smoke-import the app
        working-directory: src
        env:
          SECRET_KEY: ci-smoke-test-secret
          ENCRYPTION_KEY: ci-smoke-test-encryption-key
          # Never connected to — the engine is lazy; tests use in-memory SQLite
          # via a dependency override. It only has to exist and parse.
          DATABASE_URL: mssql+aioodbc://sa:ci@localhost:1433/ci?driver=ODBC+Driver+18+for+SQL+Server
        run: |
          uv sync
          uv run python -c "import app.main; print('app imports OK')"

      - name: Run tests
        working-directory: src
        env:
          SECRET_KEY: ci-smoke-test-secret
          ENCRYPTION_KEY: ci-smoke-test-encryption-key
          # Never connected to — the engine is lazy; tests use in-memory SQLite
          # via a dependency override. It only has to exist and parse.
          DATABASE_URL: mssql+aioodbc://sa:ci@localhost:1433/ci?driver=ODBC+Driver+18+for+SQL+Server
        run: uv run pytest -q

      # `secrets` isn't available in job/step `if:` conditions, so turn its
      # presence into a step output the later steps can gate on.
      - name: Is Azure configured?
        id: az
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          MIGRATION_COMPLETE: ${{ vars.MIGRATION_COMPLETE }}
        run: |
          test "$MIGRATION_COMPLETE" = "true" || { echo '::error::Production cutover is not complete'; exit 1; }
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Tests passed. Set AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID / RESOURCE_GROUP / GHCR_TOKEN to enable deploys."
          fi

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: steps.az.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Always builds (validates the Dockerfile + uv.lock); only pushes when
      # there is somewhere to deploy it to.
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          push: ${{ steps.az.outputs.configured == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ env.ENVIRONMENT }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ env.ENVIRONMENT }}-latest
          cache-from: type=gha,scope=prod-api
          cache-to: type=gha,mode=max,scope=prod-api

      - name: Log in to Azure (OIDC)
        if: steps.az.outputs.configured == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API container
        if: steps.az.outputs.configured == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          test "$(az account show --query id -o tsv)" = "cda65360-878b-48f2-a774-6eb4782a95aa"
          IMAGE="${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ env.ENVIRONMENT }}-${{ github.sha }}"
          az webapp config container set \
            --resource-group evtrip-prod-rg \
            --name ${{ env.API_APP_NAME }} \
            --container-image-name "$IMAGE" \
            --container-registry-url https://${{ env.REGISTRY }} \
            --container-registry-user ${{ github.repository_owner }} \
            --container-registry-password "$GHCR_TOKEN" --output none
          # `container set` above already rolls the container, so this restart is
          # belt-and-braces. ARM has been observed returning a spurious
          # ResourceNotFound here for a resource the same credential can read and
          # update moments earlier, so a failure must not fail the deploy.
          az webapp restart \
            --resource-group evtrip-prod-rg \
            --name ${{ env.API_APP_NAME }} \
            || echo "::warning title=Restart skipped::az webapp restart errored; the image swap already restarted the container."

      # `container set` returns as soon as ARM accepts the swap, not when the
      # app is serving — so "deployed" was a claim about a request, not about
      # the API. That gap is load-bearing for the frontend job, whose image
      # build prerenders `/ev` from `GET /api/vehicles`: it waited for this job
      # and then built against a container still coming up, three fetches timed
      # out, and the web image failed while the API deploy stood green.
      #
      # Bounded and non-fatal. If the API really is down, that is the API job's
      # own failure to report through the health probe Azure already runs; this
      # step exists to make the NEXT job wait, not to become a second alarm.
      - name: Wait for the API to answer
        if: steps.az.outputs.configured == 'true'
        run: |
          # The public host, not the azurewebsites one: it is what the web
          # build's `NEXT_PUBLIC_API_URL` points at, so it is the path that has
          # to be warm — App Service being up behind an unhealthy proxy is not
          # the thing being waited for.
          URL="${{ env.API_URL }}/health"
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "API healthy after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::warning title=API slow to start::/health did not answer 200 within 150s."

  # --- Frontend: test + build (+ deploy when Azure is configured) ------------
  frontend:
    # After the backend, because the web IMAGE BUILD reads the live API: `/ev`
    # is server-rendered from `GET /api/vehicles` at build time, and that is
    # the point of those pages. Run in parallel and a commit touching both
    # halves races its own deploy — the API container restarts while
    # `next build` is prerendering the catalog, three fetches time out, and
    # the image fails to build. The API deploys, the web app silently does
    # not, and the two tiers drift apart on green-looking main.
    #
    # `always()` because the dependency is an ORDERING, not a requirement:
    # `needs` alone would skip the frontend entirely on the frontend-only
    # commits where `backend` never runs, which is most of them. A backend
    # that ran and FAILED still blocks — there is no sense shipping a UI
    # against an API that could not be built.
    needs: [changes, infra, backend]
    if: >-
      always() && !cancelled() &&
      !inputs.migration_stage && needs.infra.result != 'failure' &&
      needs.backend.result != 'failure' &&
      (needs.changes.outputs.frontend == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: azure-production
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Type-check & build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
        run: |
          npm ci
          npx tsc --noEmit
          npx next build

      - name: Is Azure configured?
        id: az
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          MIGRATION_COMPLETE: ${{ vars.MIGRATION_COMPLETE }}
        run: |
          test "$MIGRATION_COMPLETE" = "true" || { echo '::error::Production cutover is not complete'; exit 1; }
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Type-check + build passed. Add the AZURE_* secrets to enable deploys."
          fi

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: steps.az.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ steps.az.outputs.configured == 'true' }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ env.ENVIRONMENT }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ env.ENVIRONMENT }}-latest
          cache-from: type=gha,scope=prod-web
          cache-to: type=gha,mode=max,scope=prod-web

      - name: Log in to Azure (OIDC)
        if: steps.az.outputs.configured == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Web container
        if: steps.az.outputs.configured == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          test "$(az account show --query id -o tsv)" = "cda65360-878b-48f2-a774-6eb4782a95aa"
          IMAGE="${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ env.ENVIRONMENT }}-${{ github.sha }}"
          az webapp config container set \
            --resource-group evtrip-prod-rg \
            --name ${{ env.WEB_APP_NAME }} \
            --container-image-name "$IMAGE" \
            --container-registry-url https://${{ env.REGISTRY }} \
            --container-registry-user ${{ github.repository_owner }} \
            --container-registry-password "$GHCR_TOKEN" --output none
          # `container set` above already rolls the container, so this restart is
          # belt-and-braces. ARM has been observed returning a spurious
          # ResourceNotFound here for a resource the same credential can read and
          # update moments earlier, so a failure must not fail the deploy.
          az webapp restart \
            --resource-group evtrip-prod-rg \
            --name ${{ env.WEB_APP_NAME }} \
            || echo "::warning title=Restart skipped::az webapp restart errored; the image swap already restarted the container."

      # Push the new URL set to Bing/Yandex instead of waiting to be crawled.
      # Advisory only: `continue-on-error` because a search engine's ingest
      # endpoint being unhappy is not a reason to call a good deploy failed.
      - name: Ping IndexNow
        if: steps.az.outputs.configured == 'true'
        continue-on-error: true
        env:
          SITE: ${{ env.SITE_URL }}
          KEY: ${{ env.INDEXNOW_KEY }}
        run: |
          set -uo pipefail
          HOST="${SITE#https://}"

          # The container was just rolled. Submitting before it answers would
          # ship the *old* sitemap, and the key file 404s during a cold start —
          # which IndexNow reports as 403 "invalid key" and is a confusing thing
          # to debug a week later.
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE/$KEY.txt")" = "200" ]; then
              echo "key file live after ${i} attempt(s)"; break
            fi
            [ "$i" = "30" ] && { echo "::warning title=IndexNow skipped::key file never came up"; exit 0; }
            sleep 10
          done

          # Serve-side check before we ask anyone else to trust it: the file has
          # to contain exactly the key we are about to submit. A mismatch here
          # is the whole failure mode of the two-copies-of-the-key design.
          SERVED="$(curl -s --max-time 10 "$SITE/$KEY.txt" | tr -d '[:space:]')"
          if [ "$SERVED" != "$KEY" ]; then
            echo "::warning title=IndexNow skipped::key file content does not match INDEXNOW_KEY"
            exit 0
          fi

          # The sitemap is already the answer to "what should be indexed", so
          # derive the list from it rather than keeping a second copy in CI.
          # Two plain substitutions rather than one `</\?loc>`: the `\?` there is
          # a GNU sed extension that quietly leaves the tags in place on BSD sed,
          # and the payload still looks plausible when it does.
          curl -s --max-time 30 "$SITE/sitemap.xml" \
            | grep -o '<loc>[^<]*</loc>' \
            | sed -e 's|<loc>||' -e 's|</loc>||' > urls.txt
          COUNT=$(wc -l < urls.txt | tr -d ' ')
          if [ "$COUNT" = "0" ]; then
            echo "::warning title=IndexNow skipped::sitemap returned no URLs"
            exit 0
          fi

          jq -Rn --arg host "$HOST" --arg key "$KEY" \
                 --arg loc "$SITE/$KEY.txt" \
                 '{host:$host, key:$key, keyLocation:$loc,
                   urlList:[inputs | select(length>0)]}' urls.txt > body.json

          CODE=$(curl -s -o resp.txt -w '%{http_code}' --max-time 30 \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @body.json)

          # 200 accepted, 202 accepted with key validation still pending.
          case "$CODE" in
            200|202) echo "::notice title=IndexNow::submitted $COUNT URLs (HTTP $CODE)" ;;
            *) echo "::warning title=IndexNow::HTTP $CODE — $(cat resp.txt)" ;;
          esac
