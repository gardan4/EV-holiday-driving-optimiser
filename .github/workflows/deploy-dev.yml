name: Deploy EV Trip Optimizer (dev)

# Dev deploy: every push to `develop`. Same shape as deploy.yml (prod) — builds
# the changed tier(s), pushes to GHCR, points the dev App Services at the image.
on:
  workflow_dispatch:
  push:
    branches: [develop]

# Serialize dev deploys per ref; queue rather than cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ENVIRONMENT: dev
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.repository_owner }}/evtrip-api
  WEB_IMAGE: ${{ github.repository_owner }}/evtrip-web
  API_APP_NAME: evtrip-api-dev
  WEB_APP_NAME: evtrip-web-dev

jobs:
  # --- Decide what changed ---------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
            frontend:
              - 'frontend/**'

  # --- Backend: test + build + deploy ---------------------------------------
  backend:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Install unixODBC (needed to import pyodbc)
        run: sudo apt-get update && sudo apt-get install -y unixodbc

      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12

      - name: Smoke-import the app
        working-directory: src
        env:
          SECRET_KEY: ci-smoke-test-secret
          ENCRYPTION_KEY: ci-smoke-test-encryption-key
        run: |
          uv sync
          uv run python -c "import app.main; print('app imports OK')"

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ env.ENVIRONMENT }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ env.ENVIRONMENT }}-latest
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API container
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ env.ENVIRONMENT }}-${{ github.sha }}"
          az webapp config container set \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name ${{ env.API_APP_NAME }} \
            --container-image-name "$IMAGE" \
            --container-registry-url https://${{ env.REGISTRY }} \
            --container-registry-user ${{ github.repository_owner }} \
            --container-registry-password ${{ secrets.GHCR_TOKEN }}
          az webapp restart \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name ${{ env.API_APP_NAME }}

  # --- Frontend: test + build + deploy --------------------------------------
  frontend:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Type-check & build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://${{ env.API_APP_NAME }}.azurewebsites.net
          NEXT_PUBLIC_SITE_URL: https://${{ env.WEB_APP_NAME }}.azurewebsites.net
        run: |
          npm ci
          npx tsc --noEmit
          npx next build

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ env.API_APP_NAME }}.azurewebsites.net
            NEXT_PUBLIC_SITE_URL=https://${{ env.WEB_APP_NAME }}.azurewebsites.net
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ env.ENVIRONMENT }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ env.ENVIRONMENT }}-latest
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Web container
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ env.ENVIRONMENT }}-${{ github.sha }}"
          az webapp config container set \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name ${{ env.WEB_APP_NAME }} \
            --container-image-name "$IMAGE" \
            --container-registry-url https://${{ env.REGISTRY }} \
            --container-registry-user ${{ github.repository_owner }} \
            --container-registry-password ${{ secrets.GHCR_TOKEN }}
          az webapp restart \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name ${{ env.WEB_APP_NAME }}
