<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Belt and braces: the dashboard role also sends X-Robots-Tag, but this
         survives being saved to disk or opened from a copy. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <!-- Inline so there is no second request and no /favicon.ico 404 in the
         access log. A data: URI is allowed by the role's `img-src 'self' data:`.
         A mint dot on the deck background: the console's tab should be
         findable at a glance next to the app's own. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2343c389'/%3E%3C/svg%3E"
    />
    <title>EV Trip · mission control</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
